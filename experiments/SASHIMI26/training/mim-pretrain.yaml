# Global settings
global_settings:
  seed:
    - 43
    - 44
  project: synthFCD
  experiment:
    - SimMIM-43
    - SimMIM-44
  root_dir: /projects/prjs1526/anyBrainer/experiments  # replace with your path

# Logging settings
logging_settings:
  dev_mode: False
  worker_logs: False
  save_logs: True
  wandb_enable: True
  wandb_entity: petros-koutsouvelis-maastricht-university
  wandb_watch_enable: False

# Data settings
pl_datamodule_settings:
  name: MultimodalDataModule
  data_dir: /scratch-shared/pkoutsouvelis/mim-npy  # replace with your path
  data_handler_kwargs:
    data_format: GenericNifti
    exts: [".npy"]
  train_val_test_split: [1.0, 0.0, 0.0]
  num_workers: 12
  batch_size: 8
  extra_dataloader_kwargs:
    shuffle: True
    pin_memory: False
  train_transforms: 
    name: get_mim_transforms
    keys: ["ch1", "ch2"]
    input_size: 128
    mask_size: 16
    mask_ratio_shared: [0.4, 0.6]
    mask_ratio_unique: [0.05, 0.15]
    random_offset: True
    val_mode: False
  extra_kwargs:
    modalities_per_ch: 
      - ["t1"]
      - ["flair"]
    distinct_modalities: True
    distinct_acquisitions: True

# Model
pl_module_settings:
  name: MultimodalMIMModel
  model_kwargs:
    name: Multimodal3DSwinMIMFPN
    in_channels: 2
    patch_size: 2
    depths: [2, 2, 6, 2]
    num_heads: [3, 6, 12, 24]
    window_size: 7
    embed_dim: 48
    use_v2: True
    extra_swin_kwargs:
      use_checkpoint: True
    use_vanilla_swin: True
    merge_mode: and
    inject_modality_tokens: False
    expected_modalities:
    fusion: none
    fpn_width: 32
  optimizer_kwargs:
    name: AdamW
    auto_no_weight_decay: True
    param_groups:
    - lr: 0.0005
      weight_decay: 0.01
      param_group_prefix: ["encoder", "fpn", "head"]
  lr_scheduler_kwargs:
    name: CosineAnnealingWithWarmup
    interval: step
    frequency: 1
    warmup_iters: [2710]
    start_iter: [0]
    total_iters: 43360 # 160 epochs (+40 clamped for SWA), 271 steps/epoch
    eta_min: [0.0001]
  loss_fn_kwargs:
    name: SmoothL1Loss
    beta: 1.0
  artifacts_settings:
    log_every_n_steps: 200
    log_max_n_items: 1

# Checkpoint settings
ckpt_settings:
  new_version: False
  model_checkpoint:
  save_every_n_epochs: 50
  save_top_k: -1
  save_last: True

# Callback settings (other than model checkpointing)
pl_callback_settings: []

# Trainer settings (pl.Trainer kwargs)
pl_trainer_settings:
  max_epochs: 200
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  precision: bf16-mixed
  devices: 2
  strategy: ddp_find_unused_parameters_true
  accelerator: auto
  profiler: simple
  num_nodes: 1
  log_every_n_steps: 100
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 2
  overfit_batches: 0.0
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  limit_predict_batches: 1.0
  fast_dev_run: False